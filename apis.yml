aid: nodes-and-links
name: Nodes and Links
description: >-
  Nodes & Links is an AI-powered project management and project controls platform for the
  construction, engineering, and large capital-projects sector. It ingests and analyzes
  project schedules to surface schedule-integrity issues, delays, change control, progress,
  risk (including stress testing), resource, and earned-value-management insights, and lets
  schedulers, planners, project controllers, project managers, and executives interrogate
  their programs through natural-language queries grounded in expert project-controls logic.
  The company runs a production API at api.app.nodeslinks.com (AWS API Gateway, OAuth
  bearer-token access) with an authenticated developer portal, and is used by firms including
  Balfour Beatty, VINCI, DPR Construction, Turner & Townsend, and AECOM.
